name: Docs

# Three flows in one workflow so they share a single Actions entry:
#  - sync:    a master push (or manual run) that touches source drafts doc
#             updates with Claude Code and opens a PR (the review gate -- nothing
#             lands on master unreviewed). Docs-only pushes don't match the source
#             paths below, so there is no loop.
#  - iterate: feedback on a docs PR -- a "@claude ..." comment, or a submitted
#             review that requests changes (or mentions @claude) -- has Claude
#             bring the branch up to date with master (resolving conflicts),
#             apply the request and push it back, so the PR updates in place.
#  - revise:  weekly (and on manual runs), every open docs PR is brought up to
#             date with master and checked against the current source:
#             conflicts resolved and anything now wrong fixed, or a comment
#             recommending it be closed if it no longer applies.
# Nothing here merges or closes a PR: the owner reviews, approves and merges.
# ("Merging master in" below means updating a PR's own branch, not landing it.)
# Each job is gated by event type, so a review runs only `iterate`, and so on.
on:
  push:
    branches: [master]
    paths:
      - engine/**
      - editor/**
      - samples/**
  workflow_dispatch:
    inputs:
      base:
        description: >-
          Git ref to diff from (e.g. a commit SHA). Manual runs default to the
          previous commit, which is the workflow-YAML commit itself after you
          push a workflow change -- set this to the commit BEFORE the source
          changes you want documented (e.g. 90dc33d to cover 1ecf031), or to an
          older ref to backfill docs for already-merged work.
        required: false
        default: ""
  schedule:
    - cron: "0 3 * * 1" # Mondays: revise open docs PRs
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  statuses: write # the jobs self-report the required checks on docs PRs

jobs:
  # On a master push that touches source, draft documentation updates with Claude
  # Code and open a PR with them.
  sync:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: docs-sync
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Collect changed source files
        id: changed
        run: |
          # A manual run's explicit base wins; otherwise use the push's
          # before-sha. Either is validated below and falls back to HEAD~1.
          base='${{ github.event.inputs.base }}'
          if [ -z "$base" ]; then
            base='${{ github.event.before }}'
          fi
          if [ -z "$base" ] \
             || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          files="$(git diff --name-only "$base" HEAD -- engine editor samples | grep -vE '\.md$' || true)"
          if [ -z "$files" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
            { echo "files<<EOF"; echo "$files"; echo "EOF"; } >> "$GITHUB_OUTPUT"
            # The actual before->after diff Claude reviews (kept out of the PR by
            # the add-paths allowlist; lives at the repo root so Claude can Read it).
            git diff "$base" HEAD -- engine editor samples > source.diff
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changed.outputs.empty == 'false'
        with:
          node-version: "20"

      - name: Install Claude Code
        if: steps.changed.outputs.empty == 'false'
        run: npm install -g @anthropic-ai/claude-code

      - name: Create or update docs for the changed source
        if: steps.changed.outputs.empty == 'false'
        env:
          # Long-lived subscription token from `claude setup-token`
          # (use ANTHROPIC_API_KEY instead if you switch to Console API billing).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CHANGED: ${{ steps.changed.outputs.files }}
        run: |
          # The CLI sends the token as an HTTP auth header; a stray newline or space
          # in the secret makes that header invalid ("Header has invalid value").
          # Strip whitespace defensively so it doesn't matter how the secret was pasted.
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          PROMPT="The following source files changed (diff against the base ref):
          $CHANGED

          The exact before->after changes are in source.diff at the repo root -- READ IT FIRST to see what actually changed. The whole repository is checked out, so Read/Grep/Glob any source or doc file you need to judge the impact.

          Then bring the Markdown documentation under docs/ in line with these changes wherever they alter what a game developer relies on (public API, behaviour, structure, or example snippets). There are two cases, and you should do BOTH as needed:
          - UPDATE an existing page when a change alters a feature that docs/ already covers.
          - CREATE a new page when a change introduces a public feature or subsystem a game developer relies on and NO page documents it yet (this is expected for new architecture -- do not skip it just because nothing exists to edit). Place it and register it in the mkdocs.yml nav per .github/docs-structure.md so it appears on the site.
          If the change is internal-only (a refactor, a comment, a private detail) and the docs still read correctly, make NO edits. Document the public surface, not every changed file.

          Read .github/docs-style.md (prose and voice) and .github/docs-structure.md (page layout, navigation, and what you may edit) before editing, and follow both. Match the voice and structure of the existing docs.

          Finally, if (and only if) you edited any docs, write a single-line pull request title to the file docs-pr-title.txt at the repository root. Start it with 'docs: ' and concisely name what you actually changed -- the page(s) or feature(s) touched, not 'recent source changes' (e.g. 'docs: document the block geometry system' or 'docs: update the particle API reference and add a decals page'). Keep it under ~70 characters and write nothing else to that file. If you made no doc edits, do not create the file."
          printf '%s' "$PROMPT" | claude -p \
            --permission-mode acceptEdits --max-turns 60 \
            --allowedTools "Read,Edit,Write,Grep,Glob"

      - name: Did Claude change any docs?
        id: edited
        if: steps.changed.outputs.empty == 'false'
        run: |
          # Only the docs/ tree and mkdocs.yml count (source.diff sits at the repo
          # root and is ignored). If Claude made no edits, the PR step is skipped
          # so a no-op run leaves any open docs PR untouched instead of letting
          # create-pull-request close it for having no diff.
          if [ -n "$(git status --porcelain -- docs mkdocs.yml)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the PR title
        id: title
        if: steps.edited.outputs.changed == 'true'
        run: |
          # Claude writes a title describing the actual doc changes to
          # docs-pr-title.txt (repo root, kept out of the PR by add-paths). Take
          # its first non-empty line; fall back to the generic title if the file
          # is missing or empty so the PR always has a sensible name.
          default="docs: sync with recent source changes"
          title="$(grep -m1 . docs-pr-title.txt 2>/dev/null | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [ -z "$title" ]; then
            title="$default"
          fi
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Open a PR if docs changed
        id: cpr
        if: steps.edited.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # docs/ plus mkdocs.yml (repo root) so a newly added page ships with
          # its nav entry; source.diff and other root files stay out of the PR.
          add-paths: |
            docs
            mkdocs.yml
          # A fresh branch per triggering commit (docs/auto-sync-<short-sha>) so a
          # new source change opens its OWN PR instead of force-updating the
          # branch of an earlier, still-open docs PR. delete-branch cleans each up
          # when its PR merges or closes.
          branch: docs/auto-sync
          branch-suffix: short-commit-hash
          base: master
          delete-branch: true
          title: ${{ steps.title.outputs.title }}
          commit-message: ${{ steps.title.outputs.title }}
          labels: documentation
          body: |
            Automated documentation update for source changes on `master`, drafted by
            Claude Code from the files changed in the triggering push.

            **Review before merging.** If the docs didn't actually need changing, just
            close this PR — no harm done. To have Claude change it, comment
            `@claude <what to change>`, or submit a review requesting changes (its text
            is the request; "fix conflicts" brings it up to date with master).

      # Safe: create-pull-request restricts this PR to docs/ + mkdocs.yml (add-paths).
      - name: Mark required checks satisfied (docs-only PR)
        if: steps.edited.outputs.changed == 'true' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/mark-docs-checks.sh "${{ steps.cpr.outputs.pull-request-head-sha }}"

  # Feedback on a docs PR: Claude brings the branch up to date with master
  # (resolving any conflicts), does what the feedback asks, and pushes the
  # result back so the PR updates in place.
  iterate:
    # A "@claude" comment, or a submitted review that requests changes or
    # mentions @claude -- from someone with write access (this runs with repo
    # secrets, so never an arbitrary commenter), and never from a bot (which
    # would loop).
    if: >-
      (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
        && (github.event.issue.pull_request || github.event.pull_request)
        && github.event.comment.user.type != 'Bot'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review'
        && github.event.review.user.type != 'Bot'
        && (github.event.review.state == 'changes_requested' || contains(github.event.review.body, '@claude'))
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # One run per PR, queued (not cancelled) so two requests can't push over
      # each other mid-commit. Shared with `revise`, which also pushes to PRs.
      group: docs-pr-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      PR: ${{ github.event.issue.number || github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out the PR branch (docs PRs only)
        id: pr
        run: |
          branch="$(gh pr view "$PR" --json headRefName --jq .headRefName)"
          if [[ "$branch" != docs/* ]]; then
            echo "PR #$PR ($branch) isn't a docs PR; nothing to do."
            echo "docs=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "docs=true" >> "$GITHUB_OUTPUT"
          gh pr checkout "$PR"

      - name: Bring the branch up to date with master
        id: merge
        if: steps.pr.outputs.docs == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          # A docs PR only touches docs/ and mkdocs.yml, so that's where any
          # conflicts are; Claude resolves them along with the request.
          if git merge --no-edit origin/master; then
            echo "conflicts=" >> "$GITHUB_OUTPUT"
          else
            { echo "conflicts<<EOF"; git diff --name-only --diff-filter=U; echo "EOF"; } >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.pr.outputs.docs == 'true'
        with:
          node-version: "20"

      - name: Install Claude Code
        if: steps.pr.outputs.docs == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Apply the requested change
        if: steps.pr.outputs.docs == 'true'
        env:
          # Same subscription token the sync job uses.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REQUEST: ${{ github.event.comment.body || github.event.review.body }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          # Strip whitespace so a stray newline in the secret can't make the auth
          # header invalid (see the sync job for the full note).
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          if [ -z "$REQUEST" ]; then
            REQUEST="(A review requested changes without saying what: bring the PR up to date with master and make sure it's still accurate.)"
          fi
          CONFLICT_NOTE=""
          if [ -n "$CONFLICTS" ]; then
            CONFLICT_NOTE="This branch has just been merged with the latest master, and these files have merge conflicts:
          $CONFLICTS

          Resolve every conflict first (the <<<<<<< / ======= / >>>>>>> blocks; leave none behind): take master's current text as the base, and re-apply this pull request's documentation changes on top where they still match the current source. Drop a change master has already made, or one that no longer applies.

          "
          fi
          PROMPT="${CONFLICT_NOTE}A reviewer left this feedback on a documentation pull request:

          $REQUEST

          Do what it asks. The whole repository is checked out on the PR branch, so Read/Grep/Glob any source or doc file you need. Read .github/docs-style.md (prose and voice) and .github/docs-structure.md (page layout, navigation, and what you may edit) first, and follow both.

          Make the smallest change that satisfies the request and do not touch anything it didn't ask about. If the request is unclear, or is not a documentation change you should make here, make no edits (beyond resolving any conflicts)."
          printf '%s' "$PROMPT" | claude -p \
            --permission-mode acceptEdits --max-turns 60 \
            --allowedTools "Read,Edit,Write,Grep,Glob"

      - name: Push the changes back to the PR
        if: steps.pr.outputs.docs == 'true'
        env:
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>) ' -- docs mkdocs.yml; then
            gh pr comment "$PR" --body "I couldn't resolve the conflicts with master (markers are left in the files above), so I haven't pushed anything. Resolve them by hand, or ask again with more to go on."
            exit 1
          fi
          git add -A -- docs mkdocs.yml
          if [ -f .git/MERGE_HEAD ]; then
            git commit --no-edit # the merge with master, conflicts resolved
          elif ! git diff --cached --quiet; then
            git commit -m "docs: address review feedback"
          fi
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse '@{u}')" ]; then
            gh pr comment "$PR" --body "I didn't change anything. The request looked already satisfied, or it was outside the docs I should edit here."
            exit 0
          fi
          git push
          # The push makes a new head commit with no statuses: report them again.
          bash .github/scripts/mark-docs-checks.sh "$(git rev-parse HEAD)"
          if [ -n "$CONFLICTS" ]; then
            gh pr comment "$PR" --body "Merged master in (resolving the conflicts) and pushed an update addressing your feedback."
          else
            gh pr comment "$PR" --body "Pushed an update addressing your feedback."
          fi

  # Keep open docs PRs current: bring each up to date with master, and have
  # Claude check it against the source as it is now -- updated, or flagged for
  # the owner to close if master already covers it or it no longer applies.
  revise:
    # Weekly, and on manual runs (Actions -> Docs -> Run workflow).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: docs-revise
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Revise each open docs PR
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          # The checks script, from master: it isn't on older PR branches.
          cp .github/scripts/mark-docs-checks.sh "$RUNNER_TEMP/mark-docs-checks.sh"

          gh pr list --state open --label documentation --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("docs/")) | "\(.number) \(.headRefName)"' > "$RUNNER_TEMP/prs.txt"
          if [ ! -s "$RUNNER_TEMP/prs.txt" ]; then
            echo "No open docs PRs."
            exit 0
          fi

          while read -r pr branch; do
            echo "::group::PR #$pr ($branch)"
            # Already flagged as no longer needed (and unchanged since): it's
            # waiting on the owner, so don't say it again every week.
            flagged="$(gh pr view "$pr" --json commits,comments --jq '
                 (.commits[-1].committedDate) as $last
                 | [.comments[] | select(.body | startswith("This looks like it'"'"'s no longer needed"))
                                | select(.createdAt > $last)] | length > 0')"
            if [ "$flagged" = "true" ]; then
              echo "#$pr is already flagged for closing; skipped."
              echo "::endgroup::"
              continue
            fi
            git reset --hard -q && git clean -fdq
            git fetch origin "$branch"
            git checkout -q -B "$branch" "origin/$branch"
            # What this PR changes, against where it branched off.
            git diff "$(git merge-base origin/master HEAD)" HEAD -- docs mkdocs.yml > pr.diff
            conflicts=""
            if ! git merge --no-edit origin/master >/dev/null; then
              conflicts="$(git diff --name-only --diff-filter=U)"
            fi
            rm -f docs-pr-verdict.txt

            CONFLICT_NOTE=""
            if [ -n "$conflicts" ]; then
              CONFLICT_NOTE="The branch has just been merged with the latest master, and these files have merge conflicts:
          $conflicts
          Resolve every conflict (leave no <<<<<<< / ======= / >>>>>>> blocks): take master's current text as the base and re-apply this pull request's changes on top where they still hold.
          "
            fi
            PROMPT="You are revising an open documentation pull request (#$pr) that may be out of date: master has moved on since it was drafted. Its own changes are in pr.diff at the repo root -- READ IT FIRST. The repository is checked out on the PR branch with the latest master merged in, so the source and the other docs are as they are now.
          ${CONFLICT_NOTE}
          Check the pull request against the current source:
          - Is what it documents still there and still as it describes (APIs, behaviour, file layout, examples)? Fix anything that's now inaccurate, following .github/docs-style.md and .github/docs-structure.md (read both first).
          - Has master already documented the same things (another docs PR merged since)? Then this one may be redundant.

          Then write your verdict to docs-pr-verdict.txt at the repo root: first line exactly 'keep' or 'close', then a short paragraph for the PR thread -- for 'keep', what you changed (or that it's still accurate as is); for 'close', why it's no longer needed. Choose 'close' only if nothing in it is still worth merging; if part of it is, keep it and remove the rest."
            if ! printf '%s' "$PROMPT" | claude -p --permission-mode acceptEdits --max-turns 60 \
                 --allowedTools "Read,Edit,Write,Grep,Glob"; then
              echo "::warning::Claude couldn't finish revising #$pr; left as it was."
              git merge --abort 2>/dev/null || true
              echo "::endgroup::"
              continue
            fi

            verdict="$(head -n1 docs-pr-verdict.txt 2>/dev/null | tr -d '[:space:]')"
            note="$(tail -n +2 docs-pr-verdict.txt 2>/dev/null)"
            if [ "$verdict" = "close" ]; then
              # The owner decides: say so, change nothing.
              git merge --abort 2>/dev/null || true
              gh pr comment "$pr" --body "This looks like it's no longer needed, so I'd close it (I haven't changed anything):

          $note"
            elif git grep -nE '^(<<<<<<<|>>>>>>>) ' -- docs mkdocs.yml >/dev/null; then
              git merge --abort 2>/dev/null || true
              gh pr comment "$pr" --body "I tried to bring this up to date with master but couldn't resolve its conflicts, so I've left it as it was. Resolve them by hand, or submit a review with more to go on."
            elif [ -z "$conflicts" ] && [ -z "$(git status --porcelain -- docs mkdocs.yml)" ]; then
              # Merges cleanly and still accurate: nothing worth a commit.
              echo "#$pr is still accurate; left as it is."
            else
              git add -A -- docs mkdocs.yml
              if [ -f .git/MERGE_HEAD ]; then
                git commit -q --no-edit
              elif ! git diff --cached --quiet; then
                git commit -q -m "docs: revise against the current source"
              fi
              if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$branch")" ]; then
                git push -q origin "$branch"
                bash "$RUNNER_TEMP/mark-docs-checks.sh" "$(git rev-parse HEAD)"
                gh pr comment "$pr" --body "Brought this up to date with master${conflicts:+ (resolving conflicts)} and checked it against the current source.

          ${note:-Still accurate.}"
              fi
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/prs.txt"
