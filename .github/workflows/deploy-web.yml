name: Build, test, and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run per branch or pull request: a new push supersedes an in-flight run of
# the same ref, but a master push never cancels a pull request's run (and vice
# versa). Pages-deploy serialization lives on the deploy job, not here.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether anything but documentation changed. Docs-only changes (docs/,
  # mkdocs.yml, Markdown) can't break the code, so the code jobs below skip
  # (a skipped job counts as passed for required checks) and only the docs are
  # built: in full on master, which redeploys the site.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Did anything but docs change?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            push) base="$PUSH_BEFORE"; head="$GITHUB_SHA" ;;
            *) base="" ;; # a manual run builds everything
          esac
          # Unknown or missing base (a new branch, a force-push): build everything.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "$head")"
          echo "Changed:"; echo "$changed" | sed 's/^/  /'
          # Collected, not piped into `grep -q`: that stops reading early, and
          # with pipefail (Actions' default) the writer's broken pipe would
          # make a code change look docs-only.
          code_files="$(grep -vE '^(docs/.*|mkdocs\.yml|.*\.md)$' <<< "$changed" || true)"
          if [ -n "$code_files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs only: skipping the build and tests."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test-core:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    # engine-core has no third-party dependencies (vendored Lua + glm), so the
    # tests build with just CMake + a compiler -- no Conan, SDL, or apt packages.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Caches compiled object files (the vendored Lua sources and the engine's
      # own) across runs, keyed by preprocessed source + flags. Namespaced per
      # job so each compiler/flag set keeps its own store.
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-${{ runner.os }}

      - name: Configure (engine-core only)
        run: >
          cmake -S . -B build-core -DENGINE_CORE_ONLY=ON -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build tests
        run: cmake --build build-core -j "$(nproc)"

      - name: Run tests
        run: ctest --test-dir build-core --output-on-failure --parallel "$(nproc)"

  # The core-only build instrumented with ASan + UBSan. Pairs with test-core so a
  # standalone engine-core release gates on sanitized core tests too, without
  # pulling in the runtime stack (no Conan, SDL, or apt packages).
  sanitize-core:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-${{ runner.os }}

      - name: Configure (engine-core only, sanitized)
        run: >
          cmake -S . -B build-core -DENGINE_CORE_ONLY=ON -DENGINE_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build tests
        run: cmake --build build-core -j "$(nproc)"

      - name: Run tests under sanitizers
        run: ctest --test-dir build-core --output-on-failure --parallel "$(nproc)"

  # Runtime tests link the full engine (SDL/imgui), so this job restores the
  # Conan dependency closure and runs a native build. They drive systems and
  # render modules through mock seams (a fake IRenderer, stub services), so
  # they run headless: no window, no GPU, no display. Split from the core test
  # job so a standalone engine-core release can gate on the core jobs alone; the
  # web deploy ships the runtime (both sample games), so it needs all of them.
  test-runtime:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Caches compiled object files (vendored Lua/imgui/tracy and the engine's
      # own) across runs. Separate from the Conan cache below, which holds the
      # third-party dependency binaries (SDL/imgui).
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-${{ runner.os }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install Conan
        run: pip install "conan==2.*"

      - name: Detect Conan profile
        run: conan profile detect --force

      # Cache the built dependency closure so reruns skip recompiling SDL/
      # imgui. The key hashes conanfile.py (where the deps are declared), so adding
      # or bumping a dep makes a new key. restore-keys then seeds the run from the
      # previous cache, and --build=missing compiles only the genuinely new
      # package -- Conan's store is keyed by package_id, so an unchanged dep is
      # reused and nothing stale is ever served.
      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      # Conan installs the deps' own system requirements (X11/GL dev packages the
      # SDL build needs) via apt, so the runner needs nothing pre-installed.
      - name: Install dependencies
        run: |
          conan install . --build=missing -s build_type=Debug \
            -c tools.build:jobs="$(nproc)" \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True

      - name: Configure (engine and tests)
        run: >
          cmake --preset debug -DENGINE_BUILD_SAMPLE=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/Debug -j "$(nproc)"

      - name: Run runtime tests
        run: ctest --test-dir build/Debug -L runtime --output-on-failure --parallel "$(nproc)"

  # The runtime build instrumented with ASan + UBSan, running the runtime tests
  # under them so memory errors and UB the functional job passes over still fail
  # CI. Same headless seams as test-runtime; just instrumented. Core is sanitized
  # in sanitize-core, so this runs the runtime label only. ENGINE_SANITIZE applies
  # the flags to the engine libraries and tests only, so the prebuilt Conan
  # dependencies stay uninstrumented.
  sanitize-runtime:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    env:
      # Abort on the first finding (UBSan otherwise logs and continues), and
      # print a stack so the failing line is in the CI log.
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-${{ runner.os }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install Conan
        run: pip install "conan==2.*"

      - name: Detect Conan profile
        run: conan profile detect --force

      # Shares the test-runtime Conan cache. The dependencies are built without
      # sanitizer flags (ENGINE_SANITIZE instruments only our targets), so these
      # are the same binaries that job uses.
      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Install dependencies
        run: |
          conan install . --build=missing -s build_type=Debug \
            -c tools.build:jobs="$(nproc)" \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True

      - name: Configure (engine and tests)
        run: >
          cmake --preset debug -DENGINE_BUILD_SAMPLE=OFF -DENGINE_SANITIZE=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/Debug -j "$(nproc)"

      - name: Run runtime tests under sanitizers
        run: ctest --test-dir build/Debug -L runtime --output-on-failure --parallel "$(nproc)"

  # Native Windows build with MSVC. The dev machines and every other job are
  # GCC/Clang (Linux + macOS) or emcc (web); this is the only thing that
  # actually compiles the engine with the Microsoft toolchain, so it catches the
  # MSVC-specific issues those compilers don't (e.g. __FUNCSIG__ vs
  # __PRETTY_FUNCTION__, /bigobj, stricter template parsing). Builds the engine,
  # editor and player (exercising the Windows SDL entry-point link) and runs
  # the full headless test suite. Independent of the web deploy: a failure here
  # reports a red check without blocking the Pages publish.
  build-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Pinned: `windows-latest` moved to a newer Visual Studio, whose compiler
    # version ConanCenter has no prebuilt binaries for, so every dependency was
    # built from source and their CMake configures failed. VS 2022 has binaries.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install Conan
        run: pip install "conan==2.*"

      - name: Detect Conan profile
        run: |
          conan profile detect --force
          conan profile show  # in the log: the compiler (and version) packages are built for

      # Same dependency-binary cache as the Linux runtime jobs, but keyed by OS
      # so the MSVC binaries never mix with the GCC ones.
      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      # cppstd=23: `conan profile detect` defaults MSVC to C++14, which the
      # toolchain would otherwise force onto our C++23 build. shared=False keeps
      # the dependency closure static, so the test/editor executables are
      # self-contained (no DLLs to stage on PATH before ctest).
      - name: Install dependencies
        run: >
          conan install . --build=missing -s build_type=Release
          -s compiler.cppstd=23 -o "*:shared=False"

      # Use the presets Conan generates (conan-default / conan-release): they
      # carry the Visual Studio generator + the Conan toolchain, so the build
      # tree and config flags match what the dependency closure was built with.
      - name: Configure
        run: cmake --preset conan-default

      - name: Build
        run: cmake --build --preset conan-release

      - name: Run tests
        run: ctest --preset conan-release --output-on-failure

  # Enforce .clang-format on the engine sources. Pinned to the same
  # clang-format version the pre-commit hook uses, so local formatting and CI
  # never disagree (the vendored lib/ tree is excluded -- it has its own style).
  format:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install clang-format
        run: pip install "clang-format==17.0.6"

      - name: Check formatting
        run: |
          find engine/src engine/include engine/tests \
            \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.inl' \) \
            ! -path '*/engine/lib/*' -print0 \
          | xargs -0 clang-format --dry-run --Werror

  build:
    runs-on: ubuntu-latest
    needs: [changes, test-core, sanitize-core, test-runtime, sanitize-runtime]
    # After the tests pass, or -- docs only -- on master, where the site (the
    # web build and the docs together) is redeployed. A docs-only pull request
    # just checks the docs build (the `docs` job).
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure')
      && (needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The sample games are editor projects: their scene files need reflection,
      # which sfs-codegen generates on the build machine. Build it natively
      # first (it needs tree-sitter, from Conan; the same package cache as the
      # runtime jobs, so a warm run only compiles the tool).
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install Conan
        run: pip install "conan==2.*"

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Build the host sfs-codegen
        run: |
          conan install . --build=missing -s build_type=Debug \
            -c tools.build:jobs="$(nproc)" \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True
          cmake --preset debug -DENGINE_BUILD_SAMPLE=OFF -DENGINE_BUILD_TESTS=OFF \
            -DENGINE_BUILD_EDITOR=OFF
          cmake --build build/Debug --target sfs-codegen -j "$(nproc)"

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: latest

      # ccache also fronts emcc, so the wasm build reuses object files (vendored
      # libs + engine + both sample games) across runs.
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-${{ runner.os }}

      - name: Configure web build
        run: >
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release
          -DSFS_CODEGEN_EXECUTABLE="$PWD/build/Debug/bin/sfs-codegen"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build web
        run: cmake --build build-web --config Release -j "$(nproc)"

      # Docs share the game's single Pages site: the game at the root, the MkDocs
      # site under /docs. --strict fails the deploy on a broken link or nav entry.
      - name: Build docs (into /docs)
        run: |
          pip install "mkdocs-material==9.*"
          mkdocs build --strict --site-dir build-web/bin/docs

      - name: Add nojekyll
        run: touch build-web/bin/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build-web/bin

  # A docs-only pull request: no code to build, so just check the docs site
  # builds (strict: broken links and nav entries fail it).
  docs:
    needs: changes
    if: needs.changes.outputs.code == 'false' && github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"

      - name: Build docs
        run: |
          pip install "mkdocs-material==9.*"
          mkdocs build --strict --site-dir site

  deploy:
    if: "!cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/master'"

    # Serialize Pages deployments. Queue rather than cancel, since interrupting a
    # deploy mid-flight can leave the site half-published.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
