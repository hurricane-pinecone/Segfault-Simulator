name: CLA

# Every outside contributor signs the Contributor License Agreement (CLA.md)
# once, by commenting on their first pull request. The bot comments on pull
# requests from authors who haven't signed, sets a failing status until they
# do, and records each signature in signatures/cla.json on the cla-signatures
# branch (kept off master so its commits never need review).
#
# pull_request_target runs with the repo's token on pull requests from forks.
# It's safe here because nothing checks out or runs the pull request's code:
# the action only reads its commit authors through the API.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # commits signatures to the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target'
      || (github.event.issue.pull_request
          && (github.event.comment.body == 'recheck'
              || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/master/CLA.md
          branch: cla-signatures
          # The owner, and bots (the docs bot, Dependabot), never sign.
          allowlist: hurricane-pinecone,*[bot]
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before it can be merged, please
            read the [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/master/CLA.md)
            and sign it by commenting below with the sentence shown. You only
            need to do this once.
